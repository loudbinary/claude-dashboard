# Copy to config.local.yaml and edit for this machine. Only include keys you want to change.

server:
  port: 4000
  database_path: C:/Users/you/.claude-dashboard/dashboard.sqlite

claude:
  # Sessions start here and pick up this workspace's Claude settings, permissions and tools.
  default_cwd: C:/path/to/your/workspace

providers:
  github:
    enabled: false          # e.g. work machine that only uses Azure DevOps
