# Shared defaults. Checked in.
# Per-machine overrides go in config.local.yaml (git-ignored); it is deep-merged over this file.
# Tokens are never stored here: each provider names the environment variable that holds its token.

server:
  host: 127.0.0.1
  port: 4000
  database_path: ./data/dashboard.sqlite

claude:
  command: claude            # CLI used to launch and resume sessions from the dashboard
  # Folder that sessions start in. Set this (in config.local.yaml, or with the CLAUDE_DASHBOARD_CWD
  # environment variable) to your workspace so sessions load its CLAUDE.md, .claude settings,
  # granted permissions, MCP servers and plugins, exactly as a terminal session started there would.
  # "." means the dashboard's own folder, which has none of that.
  default_cwd: .
  extra_args: []             # appended to every launch, e.g. ["--model", "sonnet"]
  # Sessions started with the "New session" button. They run headless, so they cannot stop to
  # ask for permission: anything not allowed here is denied rather than prompted.
  new_session:
    # Leave both empty to use the workspace's own Claude settings (recommended).
    permission_mode:           # override: default | acceptEdits | plan | bypassPermissions
    allowed_tools: []          # extra tools to allow, e.g. ["Read", "Edit", "Bash(git:*)"]

providers:
  azure_devops:
    enabled: true
    token_env: AZDO_PAT
    api_version: "7.1"
  github:
    enabled: true
    token_env: GITHUB_TOKEN
  pagerduty:
    enabled: true
    token_env: PAGERDUTY_TOKEN   # REST API key or user token, read-only is enough

watch:
  poll_interval_seconds: 60

# Buttons shown in the dashboard. Add entries here; no code change needed.
#   kind: session -> starts a new Claude session with `prompt`
#   kind: watch   -> polls a pipeline run and raises a status when it needs you
#   accepts: pr | run | incident -> what kind of URL the button expects (read from the clipboard)
#   prompt placeholders: {url} {title} {provider} {details} (details = data the provider prefetches, e.g. PagerDuty alerts)
actions:
  - key: review_pr
    label: Review PR
    kind: session
    accepts: pr
    name: "PR review: {title}"
    prompt: |
      Review the pull request at {url}.
      Read the description and the full diff, then report: a short summary, correctness
      problems, security concerns, and suggested changes. Do not push or post comments.
    model:                     # empty = the CLI default; or sonnet | opus | haiku | a full model id (this action only)
    permission_mode:           # empty = use the workspace's Claude settings
    allowed_tools: []
  # Started by the Teams sweep (teams_sweep.action). It also shows as a button, since it accepts a PR URL.
  # Same review as above, plus where the link came from.
  - key: review_pr_teams
    label: Review PR (from Teams)
    kind: session
    accepts: pr
    name: "PR review: {title}"
    prompt: |
      Review the pull request at {url}.
      It was shared by {sender} in the Teams source "{source}": {message_url}
      Read the description and the full diff, then draft a review: a short summary, correctness
      problems, security concerns, and suggested changes, as draft comments (file, line, comment).
      Do NOT post any comment, vote, approve, reject, or change the pull request in any way, and do not
      push. This is a draft for Charles to approve and post himself.
      End with a clear verdict line, either "Verdict: clean" or "Verdict: needs changes", followed by the
      draft comments, ready for approval.
    model:                     # empty = the CLI default; set a model here to review Teams-found PRs with it
    permission_mode:           # empty = use the workspace's Claude settings
    allowed_tools: []
  - key: investigate_pipeline
    label: Investigate pipeline
    kind: session
    accepts: run
    name: "Pipeline debug: {title}"
    prompt: |
      Debug the errors in the pipeline run at {url}.
      Find the failed (or still failing) stages, jobs and tasks, read their logs, and work out the
      root cause. Then report: what failed and where, the root cause with the log lines that show it,
      whether it is caused by the code change, the pipeline definition, the agent or environment, or
      something transient, and the fix you recommend. Do not re-run, cancel or edit the pipeline,
      push code, or change any cloud resources. Investigate and report only.
    permission_mode:           # empty = use the workspace's Claude settings
    allowed_tools: []
  - key: analyze_pagerduty
    label: Analyze PagerDuty Incident
    kind: session
    accepts: incident
    name: "Incident: {title}"
    prompt: |
      Analyze the PagerDuty incident at {url}.
      The dashboard prefetched the incident, its alerts and its timeline:

      {details}

      Work out what is actually wrong: identify the affected service and resource, then gather
      evidence with the read-only tools available in this workspace (logs, metrics, Kubernetes state,
      recent deployments and pipeline runs, Azure resource health). Then report:
      1. What fired and why, in one paragraph.
      2. Root cause (or the leading hypotheses, ranked), with the evidence for each.
      3. Whether it is ongoing, self-resolved, or noise (threshold or alert-rule problem).
      4. Recommended fixes: an immediate mitigation, the durable fix, and any alert tuning.
      Do not acknowledge, resolve, reassign or comment on the incident, and do not change any cloud,
      cluster or pipeline resources. Investigate and report only.
    permission_mode:           # empty = use the workspace's Claude settings
    allowed_tools: []
  - key: watch_pipeline
    label: Watch pipeline
    kind: watch
    accepts: run

# Watches Teams chats and channels for Azure DevOps pull request links and starts a review session
# (the `action` above) for each PR that still needs review. Disabled here; enable it and list the
# sources in config.local.yaml. See the README section "Teams PR sweep".
teams_sweep:
  enabled: false
  interval_seconds: 300
  active_hours: { days: [1, 2, 3, 4, 5], start: "07:00", end: "19:00", time_zone: America/New_York }  # days: 1 = Monday ... 7 = Sunday
  model: haiku               # the scanner that only fetches messages; NOT the review model (set `model:` on the action)
  action: review_pr_teams
  max_concurrent_reviews: 2
  notify_started: true       # toast when a review starts; the finished toast (with the verdict) comes from notifications:
  me: ""                  # your Azure DevOps sign-in (uniqueName); PRs you already voted on are skipped
  sources: []                # [{ name: "Dev Team", url: "<Teams chat or channel link>" }]

# Windows toast when a session or watch needs you. Clicking it opens the dashboard on that session.
# The toast is withdrawn once the item no longer needs you. Windows only; ignored elsewhere.
notifications:
  enabled: true
  states: []               # empty = every status below marked attention: true
  scenario: reminder       # reminder = stays on screen until clicked | default = slides into the notification centre
  delay_seconds: 15        # skip the toast if you answer within this long
  base_url:                # empty = http://<server.host>:<server.port>
  app_name: Claude Dashboard

ui:
  inactive_after_minutes: 120
  # Rows and the header count turn this color once you have seen them (opened the session, or clicked the
  # check mark). They still need you; they just stop shouting. A new state makes them vivid again.
  seen_color: "#667085"
  status:
    needs_permission: { label: Needs permission,       color: "#D92D20", attention: true }
    waiting_reply:    { label: Waiting for your reply, color: "#F79009", attention: true }
    approval_pending: { label: Awaiting approval,      color: "#7A5AF8", attention: true }
    failed:           { label: Failed,                 color: "#912018", attention: true }
    working:          { label: Working,                color: "#2E90FA", attention: false }
    watching:         { label: Watching,               color: "#2E90FA", attention: false }
    done:             { label: Done,                   color: "#12B76A", attention: false }
    succeeded:        { label: Succeeded,              color: "#12B76A", attention: false }
    canceled:         { label: Canceled,               color: "#98A2B3", attention: false }
    idle:             { label: Inactive,               color: "#98A2B3", attention: false }
